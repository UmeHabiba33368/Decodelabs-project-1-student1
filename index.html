<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <h1>Student Management Dashboard</h1>
    </header>


    <!-- Navigation -->
    <nav class="site-nav" aria-label="Main navigation">

        <a href="#home">Home</a>

        <a href="#courses">Courses</a>

        <a href="#progress">Progress</a>

    </nav>


    <!-- Main Content -->
    <main>

        <!-- Welcome Section -->
        <section id="home" class="welcome-section" aria-labelledby="welcomeMessage">

            <h2 id="welcomeMessage">
                Welcome, Student!
            </h2>

            <p>
                Continue your learning journey.
            </p>

            <button id="continueButton" type="button">
                Continue Course
            </button>

        </section>


        <!-- Courses Section -->
        <section id="courses" aria-labelledby="coursesHeading">

            <h2 id="coursesHeading">
                My Courses
            </h2>


            <div class="courses">


                <!-- Mathematics -->
                <article class="course-card">

                    <h3>Mathematics</h3>

                    <p id="mathProgress">
                        Progress: 70%
                    </p>

                    <div class="progress-track" aria-hidden="true">

                        <div
                            id="mathProgressBar"
                            class="progress-bar"
                            style="width: 70%;">
                        </div>

                    </div>

                    <button
                        class="view-course"
                        type="button"
                        data-course="Mathematics">

                        View Course

                    </button>

                </article>


                <!-- Computer Science -->
                <article class="course-card">

                    <h3>Computer Science</h3>

                    <p>
                        Progress: 60%
                    </p>

                    <div class="progress-track" aria-hidden="true">

                        <div
                            class="progress-bar"
                            style="width: 60%;">
                        </div>

                    </div>

                    <button
                        class="view-course"
                        type="button"
                        data-course="Computer Science">

                        View Course

                    </button>

                </article>

                <!-- Data Structures -->
                <article class="course-card">

                    <h3>Data Structures</h3>

                    <p>
                        Progress: 35%
                    </p>

                    <div class="progress-track" aria-hidden="true">

                        <div
                            class="progress-bar"
                            style="width: 35%;">
                        </div>

                    </div>

                    <button
                        class="view-course"
                        type="button"
                        data-course="Data Structures">

                        View Course

                    </button>

                </article>

            </div>

        </section>


        <!-- Progress Section -->
        <section
            id="progress"
            class="progress-section"
            aria-labelledby="progressHeading">

            <h2 id="progressHeading">
                Progress
            </h2>

            <p id="statusMessage" aria-live="polite">
                Choose a course to see its status.
            </p>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 Student Management Dashboard
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
